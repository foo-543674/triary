# Supply-chain policy for the backend's dependency graph, checked by
# cargo-deny (`security / cargo deny` in .github/workflows/ci.yml).
# Policy and the admission procedure for new crates:
# docs/dependency-policy.md. Relaxing anything here is a verifier change and
# needs the owner's approval (CODEOWNERS).

[graph]
all-features = true

[advisories]
# RustSec advisory database. Vulnerabilities always fail; unmaintained and
# unsound notices fail for crates anywhere in the graph, yanked versions too.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# An advisory may be ignored only with an entry here that names the advisory,
# why it does not apply, and when to revisit (docs/dependency-policy.md).
ignore = [
  # Same exception and reasoning as backend/.cargo/audit.toml (cargo audit):
  # RUSTSEC-2023-0071, Marvin attack in `rsa`, pulled in by sqlx-mysql for
  # MySQL password authentication. No patched `rsa` release; revisit when
  # sqlx-mysql adopts `rsa` >= 0.10.
  { id = "RUSTSEC-2023-0071", reason = "no fix upstream; see backend/.cargo/audit.toml" },
]

[licenses]
# Permissive licenses only. Anything else (copyleft, unknown, missing) fails
# and needs an owner decision before the crate comes in.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[licenses.private]
# triary-backend itself is not published (publish = false) and has no license.
ignore = true

[bans]
# Version requirements like `*` let any future release in.
wildcards = "deny"
multiple-versions = "warn"
# Crates pulled in only by build scripts / proc macros run code at build
# time too; they are covered by the same admission procedure.

[sources]
# Only crates.io. Git dependencies and other registries bypass the
# registry's immutability (a git ref can be rewritten), so they fail.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
