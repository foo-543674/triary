version: 2
updates:
  # ---------- Frontend (pnpm) ----------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    # Supply-chain guardrail (docs/dependency-policy.md): do not propose a
    # release until it has been public for a while, so a compromised release
    # is more likely to be caught and yanked before it reaches us (Rust / npm
    # updates merge without human approval). Security updates are not delayed
    # (GitHub docs, Dependabot options reference "cooldown", read 2026-10-31).
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # NOTE: Split dev and runtime dependencies into separate update PRs so
      #       reviews stay focused.
      dev-dependencies:
        dependency-type: "development"
      runtime-dependencies:
        dependency-type: "production"
    # NOTE: Keep `ignore` minimal on purpose. We want to be notified
    #       whenever an upstream of a transitive dep currently patched via
    #       `pnpm.overrides` ships a fix, so only exact, documented exclusions
    #       go here.
    ignore:
      # TypeScript 7 breaks `storybook build` and makes dependency-cruiser
      # analyse nothing (observed 2026-10-31 on PR #41). Excluded by the
      # owner's decision in issue #44; 6.x minor / patch updates still come.
      # Remove this entry once Storybook and dependency-cruiser support 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # ---------- Backend (cargo) ----------
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    # Supply-chain guardrail (docs/dependency-policy.md): do not propose a
    # release until it has been public for a while, so a compromised release
    # is more likely to be caught and yanked before it reaches us (Rust / npm
    # updates merge without human approval). Security updates are not delayed
    # (GitHub docs, Dependabot options reference "cooldown", read 2026-10-31).
    cooldown:
      default-days: 7
      semver-major-days: 14

  # ---------- GitHub Actions ----------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    # Same guardrail; github-actions supports only default-days.
    cooldown:
      default-days: 7
