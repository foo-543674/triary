# NOTE: Remote acceptance verifier. Contract: docs/remote-acceptance.md.
#       This is NOT a review: no LLM runs here. It checks, from the protected
#       base branch's definition, that the PR head passed the deterministic
#       gates and carries a review-ledger snapshot that meets
#       docs/review-contract.md, then publishes the commit status
#       `acceptance / verdict` (required by the ruleset, GitHub Actions only).
#
#       Every trigger below runs the workflow file from the default branch,
#       so a PR cannot change how it is judged. The job checks out the base
#       branch only and never executes code from the PR.
name: Acceptance

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    # labeled / unlabeled / converted_to_draft: the hold-merge label and the
    # draft state decide approval-free merging, so changing them re-judges
    # (and the hold job below withdraws a pending auto-merge, R101).
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, converted_to_draft]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to (re)judge
        required: true

permissions: {}

jobs:
  verdict:
    name: acceptance / judge
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '<!-- triary-review-snapshot -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      automerge: ${{ steps.judge.outputs.automerge }}
      kind: ${{ steps.judge.outputs.kind }}
      head: ${{ steps.judge.outputs.head }}
    # NOTE: Runs for the same PR are serialized and nothing is ever
    #       cancelled: a cancelled verdict would leave the status pending.
    #       Every PR comment fires issue_comment, so with the default
    #       `queue: single` an unrelated comment could replace a queued
    #       verdict. `queue: max` keeps up to 100 pending runs instead
    #       (GitHub docs, workflow syntax, "concurrency"; checked 2026-10-31).
    #       Whether a job skipped by `if` joins the group is not documented,
    #       so this setting does not rely on it.
    concurrency:
      group: acceptance-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
      statuses: write
    steps:
      # DO NOT REMOVE OR WEAKEN: check out the protected base branch, never the
      # PR head. Running PR code here would let a PR judge itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: judge
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SNAPSHOT_FILE: ${{ runner.temp }}/review-snapshot.md
        # DO NOT REMOVE OR WEAKEN: a missing snapshot, a skipped gate or a
        # failed check must end as a failing `acceptance / verdict` status.
        run: bash tools/review-gate/acceptance.sh
      - name: keep the snapshot that was judged
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-snapshot-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}-${{ github.run_id }}
          path: ${{ runner.temp }}/review-snapshot.md
          if-no-files-found: warn

  # Changes that passed the verdict and merge without human approval
  # (contract: docs/remote-acceptance.md "人間の承認なしでマージしてよい変更"):
  # Dependabot dependency updates (#43) and changes by the AI that touch no
  # base file (owner decision 2026-11-01). The verdict job sets `automerge`
  # only for those classes. This job checks out nothing and runs no
  # repository code.
  # NOTE: approving needs the repository setting "Allow GitHub Actions to
  #       create and approve pull requests" (owner action, listed in #43).
  #       A merge made with GITHUB_TOKEN does not trigger push workflows on
  #       main (GitHub docs, "Triggering a workflow from a workflow"), so
  #       CI does not re-run on main for these merges; the PR's CI on the
  #       up-to-date head (ruleset: strict status checks) is the evidence.
  automerge:
    name: acceptance / automerge
    needs: verdict
    if: needs.verdict.outputs.automerge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: approve and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
          # The head the verdict judged; a newer push must be judged again.
          HEAD_SHA: ${{ needs.verdict.outputs.head }}
          KIND: ${{ needs.verdict.outputs.kind }}
        run: |
          head="$HEAD_SHA"
          case "$KIND" in
            dependency) why="Dependabot dependency update (#43)" ;;
            ai-change) why="change by the AI touching no base file (owner decision 2026-11-01)" ;;
            *) echo "unknown automerge kind: $KIND" >&2; exit 1 ;;
          esac
          gh pr review "$PR" -R "$REPO" --approve \
            --body "$why; acceptance / verdict passed on ${head:0:7}."
          # --auto waits for the ruleset's requirements. --match-head-commit
          # refuses to merge if the head moved after the verdict.
          # Observed 2026-10-31 with the ruleset active: on #50 (rstest) this
          # job approved and the PR merged within seconds (run 41211333898).
          # NOTE: unverified how it behaves with the ruleset disabled.
          gh pr merge "$PR" -R "$REPO" --auto --merge --match-head-commit "$head"

  # The owner's stop switch (R101): putting the hold-merge label on a PR or
  # turning it back into a draft withdraws an auto-merge the automerge job
  # already enabled. It cannot undo a merge that already happened: auto-merge
  # merges as soon as the ruleset is satisfied, so the label is reliable only
  # before the verdict passes. This job checks out nothing and runs no
  # repository code.
  hold:
    name: acceptance / hold
    if: >-
      github.event_name == 'pull_request_target' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'hold-merge') ||
       github.event.action == 'converted_to_draft')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: disable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # NOTE: unverified how `gh pr merge --disable-auto` exits when
        #       auto-merge was not enabled; that case is not a failure here.
        run: gh pr merge "$PR" -R "$REPO" --disable-auto || echo "auto-merge was not enabled on #$PR"
