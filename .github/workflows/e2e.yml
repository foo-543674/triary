name: E2E

# NOTE: E2E runs are slow, so we keep them off PRs and only fire after a
#       merge to main. Re-tune this trigger when CD is wired up.
on:
  push:
    branches: [main]

# The token is read-only. Once GitHub Actions may approve pull requests
# (needed to auto-merge Dependabot updates, #43), a writable token reachable
# from PR code could approve its own PR;
# this workflow runs repository code on main only, read is all it needs.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NOTE: Auto-skip the e2e job until a Playwright config exists.
  #       The job activates on its own once
  #       `frontend/playwright.config.{ts,js}` is committed.
  e2e-detect:
    name: e2e / detect
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: check
        run: |
          if compgen -G "frontend/playwright.config.*" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::frontend/playwright.config.* is missing; skipping the e2e job"
          fi

  e2e:
    name: e2e / playwright
    needs: e2e-detect
    if: needs.e2e-detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: create shared docker network
        run: docker network create triary-network || true

      - name: start local infra
        run: docker compose up -d --wait

      # Pinned to the `stable` branch head of 2026-10-31. A branch is not a
      # release, so Dependabot cannot update this pin; refresh it by hand.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: sqlx-cli

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: run migrations
        working-directory: backend
        env:
          DATABASE_URL: mysql://triary:triary@127.0.0.1:3306/triary_development
        run: sqlx migrate run

      - name: build & start backend
        working-directory: backend
        env:
          DATABASE_URL: mysql://triary:triary@127.0.0.1:3306/triary_development
        run: |
          cargo build --release
          nohup ./target/release/triary-backend > backend.log 2>&1 &

      - name: build & start frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
          nohup pnpm exec vite preview --host 0.0.0.0 --port 3000 > frontend.log 2>&1 &

      - name: install playwright
        working-directory: frontend
        run: pnpm exec playwright install --with-deps

      - name: run playwright e2e
        working-directory: frontend
        run: pnpm exec playwright test

      - name: upload playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

      - name: stop local infra
        if: always()
        run: docker compose down -v
