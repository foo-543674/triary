name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # NOTE: sqlx `query!` macros use the metadata pre-generated under `.sqlx/`
  #       so they can compile without a live database. Run
  #       `cargo sqlx prepare` locally whenever queries change.
  SQLX_OFFLINE: "true"
  # Every language command runs in the dev image through ./dev (AGENTS.md
  # "Common commands"); the runner's own toolchains are not used. Runners
  # also ship podman, which ./dev would prefer; docker is the engine here.
  TRIARY_DEV_ENGINE: docker

jobs:
  # ---------- Backend ----------
  backend-lint:
    name: backend / lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image
      - name: Resolve dev image
        id: dev
        working-directory: .
        run: echo "ref=$(./dev --image-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: backend/target
          key: target-lint-${{ steps.dev.outputs.ref }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: target-lint-${{ steps.dev.outputs.ref }}-
      - name: cargo fmt --check
        run: ../dev cargo fmt --all -- --check
      - name: cargo clippy
        run: ../dev cargo clippy --all-targets --all-features

  backend-test:
    name: backend / test (nextest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image
      - name: Resolve dev image
        id: dev
        working-directory: .
        run: echo "ref=$(./dev --image-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: backend/target
          key: target-test-${{ steps.dev.outputs.ref }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: target-test-${{ steps.dev.outputs.ref }}-
      - name: cargo nextest run
        run: ../dev cargo nextest run --all-features --no-tests=pass

  backend-build:
    name: backend / build (release)
    runs-on: ubuntu-latest
    needs: backend-lint
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image
      - name: Resolve dev image
        id: dev
        working-directory: .
        run: echo "ref=$(./dev --image-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: backend/target
          key: target-release-${{ steps.dev.outputs.ref }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: target-release-${{ steps.dev.outputs.ref }}-
      - name: cargo build --release
        run: ../dev cargo build --release

  # ---------- Frontend ----------
  frontend-lint:
    name: frontend / lint (biome ci)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image
      - run: ../dev pnpm install --frozen-lockfile
      - name: biome ci
        run: ../dev pnpm exec biome ci .
      - name: typecheck (tsc --noEmit)
        run: ../dev pnpm exec tsc --noEmit

  frontend-test:
    name: frontend / test (vitest + storybook smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image
      - run: ../dev pnpm install --frozen-lockfile
      - name: dependency-cruiser (architecture rules)
        run: ../dev pnpm run arch:test
      - name: vitest run
        run: ../dev pnpm exec vitest run
      - name: build storybook
        # NOTE: Real story rendering is covered by the vitest stories smoke
        #       test. This step exists to catch breakage in the bundler /
        #       preset / config layer by running the production storybook
        #       build.
        run: ../dev pnpm run build-storybook

  frontend-build:
    name: frontend / build (vite)
    runs-on: ubuntu-latest
    needs: frontend-lint
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image
      - run: ../dev pnpm install --frozen-lockfile
      - run: ../dev pnpm exec vite build

  # ---------- Integration tests (language agnostic via Postman / Newman) ----------
  # NOTE: Detect whether `backend/migrations/` and the Postman collection are
  #       in place. While they are missing the integration job is skipped
  #       automatically; once both land, it activates on its own.
  integration-detect:
    name: integration / detect
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if compgen -G "backend/migrations/*.sql" > /dev/null \
            && compgen -G "tests/integration/*.postman_collection.json" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "integration prerequisites not present yet; skipping newman job"
          fi

  integration-test:
    name: integration / newman
    needs: integration-detect
    if: needs.integration-detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # MySQL comes from docker-compose.yml (service mysql-test) on
    # triary-network, which ./dev joins under docker, so the dev image
    # reaches it by name. The backend and newman run in ONE ./dev call: the
    # collection targets http://127.0.0.1:8080, which is only the backend
    # when both share the container.
    env:
      DATABASE_URL: mysql://triary:triary@triary-mysql-test:3306/triary_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image
      - name: start the test database
        run: |
          docker network create triary-network
          docker compose up -d --wait mysql-test
      - name: Resolve dev image
        id: dev
        run: echo "ref=$(./dev --image-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: backend/target
          key: target-release-${{ steps.dev.outputs.ref }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: target-release-${{ steps.dev.outputs.ref }}-
      - name: run migrations
        working-directory: backend
        run: ../dev sqlx migrate run
      - name: build backend
        working-directory: backend
        run: ../dev cargo build --release
      - name: start backend and run newman
        run: |
          ./dev bash -c '
            backend/target/release/triary-backend > backend/backend.log 2>&1 &
            for _ in $(seq 1 30); do
              curl -sf http://127.0.0.1:8080/health >/dev/null && break
              sleep 1
            done
            curl -sf http://127.0.0.1:8080/health >/dev/null ||
              { echo "backend failed to start"; cat backend/backend.log; exit 1; }
            npx -y newman run tests/integration/triary.postman_collection.json'
      - name: stop the test database
        if: always()
        run: docker compose down -v

  # ---------- OpenAPI schema validation ----------
  openapi-validate:
    name: openapi / spectral lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image
      - name: spectral lint
        run: ./dev npx -y @stoplight/spectral-cli lint "openapi/**/*.{yaml,yml,json}"

  # ---------- Dependency vulnerability scans ----------
  security-scan-backend:
    name: security / cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image
      - run: ../dev cargo audit

  security-scan-frontend:
    name: security / pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image
      - run: ../dev pnpm audit --audit-level high
