name: Chromatic

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The token is read-only. Once GitHub Actions may approve pull requests
# (needed to auto-merge Dependabot updates, #43), a writable token reachable
# from PR code could approve its own PR; this workflow runs PR code.
# NOTE: unverified that chromaui/action needs nothing more than read; it
# reports through the Chromatic GitHub App. Check the first PR run.
permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: chromatic / publish storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # NOTE: Chromatic needs the full git history to compute the
          #       baseline diff against the previous build.
          fetch-depth: 0

      # NOTE: Detect whether the Chromatic project token is set so that
      #       repositories without it (e.g. brand-new forks) do not fail
      #       the workflow at creation time. Subsequent steps gate on this.
      - name: detect chromatic token
        id: token
        env:
          TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CHROMATIC_PROJECT_TOKEN secret is not set; skipping chromatic run"
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.token.outputs.has_token == 'true'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.token.outputs.has_token == 'true'
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: install dependencies
        if: steps.token.outputs.has_token == 'true'
        run: pnpm install --frozen-lockfile

      - name: publish to chromatic
        if: steps.token.outputs.has_token == 'true'
        uses: chromaui/action@f305ef908327aee3b80b0e6b3bbb60a742eaa049 # v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: frontend
          # NOTE: Visual diffs are reviewed and accepted/denied by humans in
          #       the Chromatic UI; we do not want them to fail the PR check.
          #       Render errors and build errors still fail this job.
          exitZeroOnChanges: true
          # NOTE: With TurboSnap, PRs that touch neither story files nor
          #       their dependencies skip snapshotting entirely.
          onlyChanged: true
